name: kasir_warung
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  intl: 0.20.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  excel: ^4.0.6
  mobile_scanner: ^7.4.0
  file_picker: ^12.0.0-beta.7
  share_plus: ^13.3.0
  crypto: ^3.0.7
  sqlite3: ^3.5.1
  # Printer thermal Bluetooth 58mm (prd-v1.1.md §3.7.1 — versi dikunci hasil
  # riset + uji build APK release; JANGAN diganti tanpa mengulang uji itu).
  # `print_bluetooth_thermal` = transport Bluetooth Klasik (SPP); hanya
  # membaca perangkat yang SUDAH dipasangkan (bonded) sehingga aplikasi tidak
  # pernah butuh izin memindai maupun izin lokasi (AC-3.11).
  print_bluetooth_thermal: ^1.2.2
  # Generator byte ESC/POS murni Dart (tanpa kode platform) — dipakai
  # `EscPosReceiptBuilder`. Profil kapabilitas printer dimuat dari asset
  # yang di-bundle, bukan jaringan (prinsip 100% offline, prd.md §1).
  esc_pos_utils_plus: ^2.0.4
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  path_provider_platform_interface: ^2.1.3
  qr: ^4.0.0
  image: ^4.3.0
  # flutter_launcher_icons & flutter_native_splash SENGAJA TIDAK dipertahankan
  # sebagai dev_dependency permanen (plan.md Milestone 6 poin 4) — keduanya
  # cuma alat code-gen sekali pakai (ikon & splash sudah digenerate & di-
  # commit ke android/app/src/main/res + assets/), dan modul Android bawaan
  # package `flutter_native_splash` tidak punya `namespace` (format lama,
  # tidak kompatibel dengan Android Gradle Plugin proyek ini) yang membuat
  # `flutter build apk --release` GAGAL total di tahap konfigurasi Gradle
  # kalau dependency ini masih ada — walau tidak dipakai sama sekali di kode
  # Dart manapun. Untuk regenerasi ulang ikon/splash di masa depan, tambah
  # sementara lewat `flutter pub add --dev flutter_launcher_icons
  # flutter_native_splash`, jalankan generator, lalu hapus lagi sebelum
  # build release.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  assets:
    - assets/icon/
    - assets/splash/

  # Tipografi aplikasi: Plus Jakarta Sans (Tokotype, OFL) — dirancang di
  # Indonesia, geometris-humanis, angkanya lebar & jelas untuk layar kasir.
  # Sengaja DI-BUNDLE sebagai asset, BUKAN lewat package `google_fonts`:
  # google_fonts mengunduh file font dari internet saat runtime pertama,
  # sedangkan PRD §1 mewajibkan aplikasi ini 100% offline tanpa satupun
  # fitur yang butuh koneksi.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Konfigurasi flutter_launcher_icons (plan.md Milestone 6 poin 4) — ikon
# sederhana keranjang belanja warna hijau brand (AppColors.primary), sesuai
# tema "Kasir Warung". `assets/icon/icon.png` (1024x1024, background hijau
# solid) dipakai untuk launcher icon biasa; `icon_foreground.png` (glyph
# putih transparan) dipakai untuk adaptive icon Android 8+ dengan background
# warna solid yang sama. Nama key top-level HARUS `flutter_icons` (bukan
# `flutter_launcher_icons`) karena versi package yang berhasil ter-resolve
# tanpa bentrok dependency dengan `excel` adalah 0.9.3 (lihat komentar di
# `dev_dependencies` di atas) — versi ini masih memakai skema config lama.
# Jalankan: flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B7A43"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Konfigurasi flutter_native_splash (plan.md Milestone 6 poin 4) — splash
# native warna tema (hijau brand) + logo keranjang di tengah, sebelum
# Flutter engine selesai dimuat. Memakai `icon_foreground.png` (glyph PUTIH
# transparan, SAMA seperti foreground adaptive icon di atas) — BUKAN
# `assets/splash/splash_logo.png` (dicoba lebih dulu, tapi ternyata warna
# glyph-nya hijau/hijau-tua, nyaris tak terlihat di atas `color` hijau yang
# sama; sudah diverifikasi lewat komposit piksel). Jalankan:
#   flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#1B7A43"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#1B7A43"
    image: assets/icon/icon_foreground.png
